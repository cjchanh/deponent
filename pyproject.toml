[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deponent"
version = "0.1.1"
description = "A fail-closed agent governance kernel with a deny-by-default gate, tamper-evident ledger, and verifiable receipts."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Christopher \"CJ\" Chanhnourack", email = "contact@centennialdefense.systems" }]
keywords = ["agent", "governance", "sandbox", "audit", "ai-safety", "deny-by-default", "audit-log", "local-first", "tamper-evident"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
# The core kernel has ZERO third-party dependencies — it is standard-library only.
dependencies = []

[project.urls]
Homepage = "https://github.com/cjchanh/deponent"
Source = "https://github.com/cjchanh/deponent"
Issues = "https://github.com/cjchanh/deponent/issues"
Company = "https://centennialdefense.systems"

[project.optional-dependencies]
# Only the EXAMPLE governed-agent team needs a model runtime; the kernel does not.
ollama = []  # uses stdlib urllib against a local Ollama daemon — no package needed
mlx = ["mlx-vlm>=0.1"]  # Apple Silicon, for the local North Mini Code reference backend
# Operator-attestation overlay (operator_attest.py): ed25519 verification-only
# integrity + identity cells. The CORE kernel stays keyless/zero-dep; this is the
# separate, heavier security surface, opt-in only.
attest = ["cryptography>=42"]
dev = ["pytest>=7", "cryptography>=42"]

[tool.hatch.build]
exclude = [
  "AGENTS.md",
  "deponent/adapters/sworn.py",
  "deponent/sworn_adapter.py",
]

[tool.hatch.build.targets.wheel]
packages = ["deponent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
