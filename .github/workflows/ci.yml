name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the checked-out code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both OSes run the platform-independent core (gate/ledger/receipts/…);
        # the macOS-native Seatbelt jail tests and the DRAFT Docker tests skip on
        # Linux, while macOS runs the full suite incl. the live Seatbelt proofs.
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (core is zero-dep; the dev extra adds pytest + cryptography)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the suite
        run: python -m pytest -q

      # C4: Linux skips Seatbelt tests; macOS must actually run them. Fail the
      # macOS job if tests/test_jail.py reports any skip (pytest -rs + grep).
      - name: macOS containment tests must not skip
        if: matrix.os == 'macos-latest'
        run: |
          set -o pipefail
          python -m pytest -rs --tb=no tests/test_jail.py | tee jail-macos.txt
          if grep -E '^SKIPPED' jail-macos.txt; then
            echo "C4 FAIL: containment tests skipped on macOS"
            exit 1
          fi
          if ! grep -Eq '[0-9]+ passed' jail-macos.txt; then
            echo "C4 FAIL: tests/test_jail.py reported no passes"
            exit 1
          fi

      # The mark is earnable infrastructure, not third-party certification: CI
      # re-derives it, fail-closed. A non-conformant kernel fails this step.
      - name: Self-verify the GAK-conformant (self-assessed) mark
        run: python -m deponent.badge verify --kernel deponent
